<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="docTitle">Post Internship — InternLog</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/><text x='16' y='22' font-family='system-ui,sans-serif' font-weight='800' font-size='16' fill='white' text-anchor='middle'>IL</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/script.js" defer></script>
</head>
<body>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar" aria-label="Company navigation">
      <a class="brand" href="../index.html"><span class="brand-mark">IL</span><span>InternLog</span></a>
      <nav><a href="dashboard.html">Dashboard</a><a href="internships.html">Internships</a><a class="active" href="add-internship.html">Post Internship</a><a href="applicants.html">Applicants</a><a href="profile.html">Company Profile</a></nav>
      <div class="side-foot"><nav><a href="../index.html" data-logout>Logout</a></nav></div>
    </aside>
    <div class="main">
      <header class="topbar"><button class="menu-btn" id="menuBtn" aria-label="Toggle navigation">☰</button><h1 id="pageTitle">Post Internship</h1><div class="spacer"></div><div class="user-chip"><span class="avatar" id="avatar">C</span><span><strong id="companyName"></strong><br><span class="muted" id="companyEmail"></span></span></div></header>
      <main class="content">
        <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap"><div><h2 style="margin:0 0 6px">Create an opportunity</h2><p class="muted" style="margin:0">Give students enough detail to understand the role, expectations, and deadline.</p></div></div>
        <section class="card" style="margin-top:18px">
          <div class="alert alert-success" id="success" style="display:none"></div>
          <form id="internshipForm" novalidate>
            <div class="form-group"><label for="title">Internship Title *</label><input id="title" type="text" placeholder="Frontend Developer Intern" required><div class="field-error" id="title-error"></div></div>
            <div class="form-row">
              <div class="form-group"><label for="location">Location *</label><input id="location" type="text" placeholder="Kochi, Kerala / Remote" required><div class="field-error" id="location-error"></div></div>
              <div class="form-group"><label for="type">Internship Type *</label><select id="type"><option>On-site</option><option>Hybrid</option><option>Remote</option></select></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label for="stipend">Monthly Stipend (₹)</label><input id="stipend" type="number" min="0" step="500" placeholder="15000"></div>
              <div class="form-group"><label for="positions">Open Positions</label><input id="positions" type="number" min="1" step="1" value="1"></div>
              <div class="form-group"><label for="deadline">Application Deadline *</label><input id="deadline" type="date" required><div class="field-error" id="deadline-error"></div></div>
            </div>
            <div class="form-group"><label for="skills">Required Skills</label><input id="skills" type="text" placeholder="React, JavaScript, Git"></div>
            <div class="form-group"><label for="description">Description *</label><textarea id="description" placeholder="Describe the work, expected outcomes, mentorship, and team context." required></textarea><div class="field-error" id="description-error"></div></div>
            <div class="form-row">
              <div class="form-group"><label for="education">Preferred Education</label><input id="education" type="text" placeholder="B.Tech / B.E. / equivalent"></div>
              <div class="form-group"><label for="applyUrl">External Apply URL</label><input id="applyUrl" type="url" placeholder="https://careers.example.com/internship"></div>
            </div>
            <div class="checkbox-row"><input type="checkbox" id="published" checked><label for="published" style="font-weight:400">Publish immediately in this prototype. Uncheck to keep it as a draft.</label></div>
            <div class="form-actions"><div class="form-actions-left"><button type="submit" class="btn" id="submitButton">Publish Internship</button><a class="btn btn-secondary" href="dashboard.html">Cancel</a></div></div>
          </form>
        </section>
      </main>
    </div>
  </div>
  <script>
    (function () {
      "use strict";
      var SESSION_KEY = "internlog_session", COMPANY_KEY = "internlog_companies", JOB_KEY = "internlog_internships";
      function read(key, fallback) { try { var v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch (e) { return fallback; } }
      function write(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
      function esc(s) { return String(s == null ? "" : s).replace(/[&<>\"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
      function auth() { var s = read(SESSION_KEY, null); if (!s || s.role !== "company") { window.location.href = "login.html"; return null; } return s; }
      function fieldError(id, msg) { var i = document.getElementById(id), e = document.getElementById(id + "-error"); i.setAttribute("aria-invalid", msg ? "true" : "false"); if (e) { e.textContent = msg || ""; e.classList.toggle("visible", !!msg); } }
      document.addEventListener("DOMContentLoaded", function () {
        var s = auth(); if (!s) return; var companies = read(COMPANY_KEY, []), company = companies.find(function(c){return String(c.id)===String(s.userId);}); if (!company) { window.location.href="login.html"; return; }
        document.getElementById("companyName").textContent = company.name; document.getElementById("companyEmail").textContent = company.email; document.getElementById("avatar").textContent = company.name.charAt(0).toUpperCase();
        document.getElementById("deadline").min = new Date().toISOString().slice(0,10);
        var editId = new URLSearchParams(window.location.search).get("edit");
        var jobs = read(JOB_KEY, []);
        var editingJob = editId ? jobs.find(function(j){ return String(j.id) === String(editId) && String(j.companyId) === String(company.id); }) : null;
        if (editId && !editingJob) { window.location.href = "internships.html"; return; }
        if (editingJob) {
          document.getElementById("docTitle").textContent = "Edit Internship — InternLog";
          document.getElementById("pageTitle").textContent = "Edit Internship";
          document.getElementById("submitButton").textContent = "Save Changes";
          document.getElementById("title").value = editingJob.title || "";
          document.getElementById("location").value = editingJob.location || "";
          document.getElementById("type").value = editingJob.internshipType || "On-site";
          document.getElementById("stipend").value = editingJob.stipend || "";
          document.getElementById("positions").value = editingJob.positions || 1;
          document.getElementById("deadline").value = editingJob.deadline || "";
          document.getElementById("skills").value = (editingJob.skills || []).join(", ");
          document.getElementById("description").value = editingJob.description || "";
          document.getElementById("education").value = editingJob.education || "";
          document.getElementById("applyUrl").value = editingJob.applyUrl || "";
          document.getElementById("published").checked = editingJob.status === "Published";
        }
        document.querySelector("[data-logout]").addEventListener("click", function(e){ e.preventDefault(); localStorage.removeItem(SESSION_KEY); window.location.href="../index.html"; });
        document.getElementById("internshipForm").addEventListener("submit", function(e){
          e.preventDefault(); var title=document.getElementById("title"), location=document.getElementById("location"), deadline=document.getElementById("deadline"), desc=document.getElementById("description"), url=document.getElementById("applyUrl"), ok=true;
          if(title.value.trim().length<3){fieldError("title","Enter an internship title.");ok=false;}else fieldError("title","");
          if(!location.value.trim()){fieldError("location","Enter a location or Remote.");ok=false;}else fieldError("location","");
          if(!deadline.value){fieldError("deadline","Choose an application deadline.");ok=false;}else fieldError("deadline","");
          if(!desc.value.trim()){fieldError("description","Add a short role description.");ok=false;}else fieldError("description","");
          if(url.value.trim()){try{var u=new URL(url.value.trim());if(!/^https?:$/.test(u.protocol))throw 0;}catch(x){fieldError("applyUrl","Use a valid http(s) URL.");ok=false;}}
          if(!ok)return;
          var jobs=read(JOB_KEY,[]), now=new Date().toISOString();
          var record={companyId:company.id,company:company.name,title:title.value.trim(),location:location.value.trim(),internshipType:document.getElementById("type").value,stipend:Number(document.getElementById("stipend").value)||0,positions:Number(document.getElementById("positions").value)||1,deadline:deadline.value,skills:document.getElementById("skills").value.split(",").map(function(v){return v.trim();}).filter(Boolean),description:desc.value.trim(),education:document.getElementById("education").value.trim(),applyUrl:url.value.trim(),status:document.getElementById("published").checked?"Published":"Draft",updatedAt:now};
          if (editingJob) {
            var editIndex=jobs.findIndex(function(j){return String(j.id)===String(editingJob.id);});
            jobs[editIndex]=Object.assign({},jobs[editIndex],record);
          } else {
            record.id=jobs.reduce(function(m,j){return Math.max(m,Number(j.id)||0);},0)+1; record.createdAt=now; jobs.push(record);
          }
          write(JOB_KEY,jobs);document.getElementById("success").textContent=editingJob?"Internship updated successfully.":"Internship saved successfully.";document.getElementById("success").style.display="block";if(window.InternLog)window.InternLog.showNotification(editingJob?"Internship updated.":"Internship saved.","success");
          if (editingJob) { setTimeout(function(){window.location.href="internships.html";},450); } else { document.getElementById("internshipForm").reset(); document.getElementById("published").checked=true; document.getElementById("deadline").min=new Date().toISOString().slice(0,10); }
        });
      });
    }());
  </script>
</body>
</html>
